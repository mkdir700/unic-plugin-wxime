name: Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  process:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install OpenSSL development files
        run: |
          case "$RUNNER_OS" in
            macOS)
              brew install openssl@3 pkg-config
              echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
              ;;
            Linux)
              sudo apt-get update
              sudo apt-get install -y pkg-config libssl-dev
              ;;
          esac
      - name: Run the plugin process acceptance
        run: |
          mkdir -p artifacts
          WXIME_E2E_RECEIPT="$PWD/artifacts/process.json" go test -race ./... -count=1
          go build -mod=readonly ./cmd/unic-plugin-wxime
      - uses: actions/upload-artifact@v6
        with:
          name: wxime-process-${{ runner.os }}
          path: artifacts/process.json
